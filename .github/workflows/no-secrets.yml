name: no-secrets

# 与 .githooks/pre-commit 跑同一份规则（scripts/check_no_secrets.sh）。
# 钩子是本地的、可以 --no-verify 绕过；CI 绕不过去，所以两条都要有。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 自检（密钥 / 个人路径 / 账号标识 / 实验指纹 / 二进制）
        run: bash scripts/check_no_secrets.sh .
      - name: 历史自检（所有提交的所有文件，而不只是工作区）
        # 规则只在 scripts/check_no_secrets.sh 里写一份：这里**不要**复制模式串，
        # 否则这个文件会自匹配自己（已经踩过一次）。
        run: bash scripts/check_no_secrets.sh --history
